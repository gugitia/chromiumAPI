services:
  - type: web
    name: chromium-api
    env: node
    branch: productRoutes
    buildCommand: "npm install"
    startCommand: "npm start"
    envVars:
      - key: DATABASE_URL
        value: "mongodb+srv://render:render@chromiumcluster.ebl3qdv.mongodb.net/chromiumCluster?retryWrites=true&w=majority&appName=chromiumCluster"
        sync: true
    plan: free
    region: oregon
